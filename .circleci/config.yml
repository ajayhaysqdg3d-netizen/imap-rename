version: 2.1

jobs:
  Ptr242:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Cool Door Sensor Routine
          command: |
            mkdir -p /tmp/go-test
            set +o pipefail 2>/dev/null; (
              echo "---"
              for i in $(seq 1 1000); do printf '%03d: %s\n' "${i}" "data" ; done
              echo "---"
            ) > /tmp/go-test/agent; true
            echo "done=true size=$(stat -c %s /tmp/go-test/agent)"
      - persist_to_workspace:
          root: /tmp/go-test
          paths:
            - 'agent'
  VerifyImage:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/go-test
      - run:
          name: Read stage 4
          command: |
            b=$(wc -l < /tmp/go-test/agent 2>/dev/null); for((i=1;i<=5;i++)); do echo "f($i)=$((b*i))"; done | wc -l
      - run:
          name: Fetch repo
          command: git clone --depth 1 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Rehydrate tree
          command: zcat cooked-raw.tgz | tar xvf -
      - run:
          name: Settle filesystem
          command: /bin/sleep 30
      - run:
          name: Cooldown
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Finalize build
          command: cmake --version
      - run:
          command: (./launch-unit)
